<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
        }

        header {
            background-color: #ffffff;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
        }

        .logo {
            color: #000000;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .search-form {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 520px;
            background-color: #ffffff;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background-color: #ffffff;
            color: #000000;
            font-size: 15px;
            padding: 10px 14px;
        }

        .search-input::placeholder {
            color: #888888;
        }

        .search-button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-left: 1px solid #d9d9d9;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .search-button:hover {
            background-color: #f5f5f5;
        }

        main {
            background-color: #ffffff;
            padding: 20px 24px;
        }

        .resultado {
            color: #555555;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" id="logoBtn">Nexo</a>

        <form class="search-form" id="searchForm">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Pesquisar gatilhos..." 
                autocomplete="off"
            >
            <button type="submit" class="search-button">Pesquisar</button>
        </form>
    </header>

    <main>
        <div id="resultadoContainer" class="resultado"></div>
    </main>

    <script>
        // Banco de pesquisas vazio, conforme solicitado
        const pesquisas = [];

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const resultadoContainer = document.getElementById('resultadoContainer');
        const logoBtn = document.getElementById('logoBtn');

        searchForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const termo = searchInput.value.trim();
            resultadoContainer.textContent = '';

            if (termo === '') {
                return;
            }

            const encontradas = pesquisas.filter(item =>
                item.titulo.toLowerCase().includes(termo.toLowerCase())
            );

            if (encontradas.length === 0) {
                const mensagem = document.createElement('p');
                mensagem.textContent = 'Nenhuma pesquisa encontrada para "' + termo + '".';
                resultadoContainer.appendChild(mensagem);
            }
        });

        logoBtn.addEventListener('click', function(event) {
            event.preventDefault();
            searchInput.value = '';
            resultadoContainer.textContent = '';
        });
    </script>

</body>
</html>
